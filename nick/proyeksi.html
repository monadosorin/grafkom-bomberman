<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Golem Bomber - Proyeksi</title>
</head>
<body style="margin: 0; overflow: hidden">
    <canvas id="mycanvas" style="display: block"></canvas>

    <script type="module">
        import { mulaiScene } from "../shared/engine.js";
        import { aturProyeksi, pilihProyeksi, buatLantaiKotak } from "../shared/proyeksi.js";
        import { buatGolemBomber, animasiGolemBomber } from "./golemBomber.js";

        // semua proyeksi dari bagan, ganti pake panah kiri / kanan atau klik di menu
        // golem jalan maju mundur, jadi keliatan bedanya: di perspective dia membesar pas deket kamera,
        // di parallel (orthographic, axonometric, oblique) ukurannya tetep sama
        var proyeksiSekarang = pilihProyeksi();

        mulaiScene(function (GL) {
            return {
                objek: [buatLantaiKotak(GL, 12, 0.5), buatGolemBomber(GL)],
                animasi: animasiGolemBomber,
                lantai: false,

                // dipanggil engine tiap frame, ngisi PROJ (proyeksi) sama VIEW (kamera)
                // golem lebih gede: 2.0 = setengah tinggi yang keliatan, 1.25 = tinggi tengah badannya
                proyeksi: function (PROJ, VIEW, aspek) {
                    aturProyeksi(proyeksiSekarang(), PROJ, VIEW, aspek, 2.0, 1.25);
                }
            };
        }, 6);
    </script>
</body>
</html>
