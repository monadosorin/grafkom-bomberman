<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Magnet Bomber - Proyeksi</title>
</head>
<body style="margin: 0; overflow: hidden">
    <canvas id="mycanvas" style="display: block"></canvas>

    <script type="module">
        import { mulaiScene } from "../shared/engine.js";
        import { aturProyeksi, pilihProyeksi, buatLantaiKotak } from "../shared/proyeksi.js";
        import { buatMagnetBomber, animasiMagnetBomber } from "./magnetBomber.js";

        // semua proyeksi dari bagan, ganti pake panah kiri / kanan atau klik di menu
        var proyeksiSekarang = pilihProyeksi();

        mulaiScene(function (GL) {
            return {
                objek: [buatLantaiKotak(GL, 10, 0.5), buatMagnetBomber(GL)],
                animasi: animasiMagnetBomber,
                lantai: false,

                // dipanggil engine tiap frame, ngisi PROJ (proyeksi) sama VIEW (kamera)
                // 1.6 = setengah tinggi yang keliatan, 1.2 = tinggi tengah badan magnet
                proyeksi: function (PROJ, VIEW, aspek) {
                    aturProyeksi(proyeksiSekarang(), PROJ, VIEW, aspek, 1.6, 1.2);
                }
            };
        }, 6);
    </script>
</body>
</html>
